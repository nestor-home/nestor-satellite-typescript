<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nestor satellite</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
      label { display: block; margin: 0.5rem 0; }
      #code { font-size: 3rem; letter-spacing: 0.3em; font-variant-numeric: tabular-nums; }
      #log { font: 0.85rem ui-monospace, monospace; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>Nestor satellite</h1>
    <form id="form">
      <label>Room <input name="room" value="salon" pattern="[a-z0-9][a-z0-9_-]*" required /></label>
      <label>Device id <input name="id" value="navigateur" pattern="[a-z0-9][a-z0-9_-]*" required /></label>
      <button>Start</button>
    </form>
    <p id="status">Stopped.</p>
    <p id="code" hidden></p>
    <div id="log"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
