name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22", "24"]
    defaults:
      run:
        working-directory: nestor-satellite-typescript
    steps:
      - uses: actions/checkout@v7
        with:
          path: nestor-satellite-typescript
      # The server's schemas, for the drift test (`../nestor`).
      - uses: actions/checkout@v7
        with:
          repository: nestor-home/nestor
          path: nestor
      # The bundled voice's clips, for their drift test (`../nestor-satellite-python`).
      - uses: actions/checkout@v7
        with:
          repository: nestor-home/nestor-satellite-python
          path: nestor-satellite-python
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: nestor-satellite-typescript/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: nestor-satellite-typescript/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm package:check

  conformance:
    # The server's black-box suite against the built CLI and a headless Chromium tab, as subprocesses.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nestor-satellite-typescript
    steps:
      - uses: actions/checkout@v7
        with:
          path: nestor-satellite-typescript
      - uses: actions/checkout@v7
        with:
          repository: nestor-home/nestor
          path: nestor
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --extra voice
        working-directory: nestor
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: nestor-satellite-typescript/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: nestor-satellite-typescript/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright-core install --with-deps chromium
      - run: pnpm conformance

  # The single check the branch rules require.
  ci:
    needs: [check, conformance]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
