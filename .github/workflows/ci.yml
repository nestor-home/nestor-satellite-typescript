name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new commit on a pull request makes its earlier run moot: it is cancelled. Runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    strategy:
      matrix:
        # every Node major `engines` covers that is still maintained
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm package:check

  conformance:
    # The published server's black-box suite (`nestor satellites conformance`, version in
    # .nestor-version) against the built CLI and a headless Chromium tab, as subprocesses. One job
    # per satellite, side by side; Chromium comes from the cache once warm.
    name: conformance (${{ matrix.satellite }})
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        satellite: [cli, browser-voice, browser-camera, browser-text]
    steps:
      - uses: actions/checkout@v7
      # uvx installs the core in seconds; restoring and saving its cache cost more than they saved.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: playwright
        if: matrix.satellite != 'cli'
        run: echo "version=$(pnpm exec playwright-core --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - if: matrix.satellite != 'cli'
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      # The runner image already has Chromium's system libraries: no apt step.
      - if: matrix.satellite != 'cli'
        run: pnpm exec playwright-core install chromium
      - run: pnpm conformance test/conformance/${{ matrix.satellite }}.test.ts

  # The single check the branch rules require.
  ci:
    needs: [check, conformance]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
