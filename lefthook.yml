# Before a push: Biome (format and lint) on the pushed files, then the typecheck.
# `pnpm install` installs the hook (the "prepare" script).
pre-push:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{js,mjs,cjs,ts,mts,cts,json,jsonc,css}"
      run: pnpm exec biome check --no-errors-on-unmatched --files-ignore-unknown=true {push_files}
    - name: typecheck
      glob: "*.{ts,mts,cts}"
      run: pnpm exec tsc --noEmit -p tsconfig.json
